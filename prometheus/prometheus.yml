global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets:
          - 127.0.0.1:9090

  - job_name: node
    static_configs:
      - targets:
          - 10.0.0.10:9100
          - 10.0.0.11:9100
        labels:
          role: physical
      - targets:
          - 10.0.1.20:9100
          - 10.0.1.21:9100
        labels:
          role: virtual

  - job_name: blackbox
    metrics_path: /probe
    params:
      module:
        - http_2xx
    static_configs:
      - targets:
          - http://public.example.com:6002/
          - http://public.example.com:6003/
    relabel_configs:
      - source_labels:
          - __address__
        target_label: __param_target
      - source_labels:
          - __param_target
        target_label: instance
      - target_label: __address__
        replacement: blackbox:9115
